PACKAGE_NAME="mac80211-modecheck-skip"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="mac80211"
DEST_MODULE_LOCATION[0]="/updates/dkms"
# 安全锁: autoprep 构建前会把下一行改写为实际目标内核版本; 此占位值不匹配任何内核, 防止误构建
BUILD_EXCLUSIVE_KERNEL="^REPLACED_BY_AUTOPREP$"
# 不启用 dkms 自带 AUTOINSTALL: 各内核的构建安装由 prep 单元负责(否则 dkms 会拿最新版本试装其它内核并告警)
AUTOINSTALL="no"
MAKE[0]="make"
